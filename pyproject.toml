[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-memory"
version = "1.0.0"
description = "Local markdown memory for coding agents — ABI in abi/, Python MCP reference implementation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Felix Kempf" },
    { name = "Fabian Schindler" },
]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0,<2"]
keywords = ["mcp", "agents", "memory", "cursor", "claude", "coding-assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/agents-memory"
Repository = "https://github.com/Lolaplex/agents-memory"
Documentation = "https://github.com/Lolaplex/agents-memory/tree/main/abi"
"Bug Tracker" = "https://github.com/Lolaplex/agents-memory/issues"

[project.scripts]
agents-memory = "agents_memory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agents_memory" = [
    "bundled/**/*",
]
