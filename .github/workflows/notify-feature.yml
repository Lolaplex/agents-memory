name: Notify Feature Merged

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  notify-feature:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post feature merge to product webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL unset; skip notification"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json, os; pr_title=os.environ['PR_TITLE']; pr_number=os.environ['PR_NUMBER']; pr_url=os.environ['PR_URL']; author=os.environ['PR_USER']; repo=os.environ['GITHUB_REPOSITORY']; server=os.environ['GITHUB_SERVER_URL']; repo_url=f'{server}/{repo}'; print(json.dumps({'embeds':[{'title':f'🌱 Feature Merged into \`dev\`: #{pr_number} — {repo}','url':pr_url,'description':f'**{pr_title}**\\nMerged by @{author} into \`dev\`\\n[{repo}]({repo_url})','color':3066993}]}))")
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK_URL"
