name: CI Test Matrix

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel superseded runs so rapid pushes do not stack 12-job matrices overnight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest
          pip install -e .

      - name: Check bundled asset sync
        run: |
          python scripts/sync_bundled.py --check || python scripts/sync_bundled.py

      - name: Run unit test suite
        timeout-minutes: 10
        run: |
          python tests/run_all_tests.py

      - name: Verify CLI commands
        run: |
          agents-memory --version
          agents-memory version
          agents-memory --help
          agents-memory help
          agents-memory remote --help
          agents-memory inventory --json

      - name: Verify Docker build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          docker build -t agents-memory:test .

      - name: Build package distribution
        run: |
          python -m build

      - name: Validate distribution metadata
        run: |
          twine check dist/*

  notify:
    name: Discord
    needs: [test]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post failure to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL unset; skip"
            exit 0
          fi
          python3 <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          wf = os.environ["GITHUB_WORKFLOW"]
          ref = os.environ["GITHUB_REF_NAME"]
          url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repo}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          payload = {"content": f"**{repo}** `{wf}` failed on `{ref}`\n{url}"}
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          urllib.request.urlopen(req, timeout=15).read()
          PY
