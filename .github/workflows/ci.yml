name: CI Test Matrix

on:
  push:
    branches: [main, dev, "feat/*", "cloud-sync"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel superseded runs so rapid pushes do not stack 12-job matrices overnight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest
          pip install -e .

      - name: Check bundled asset sync
        run: |
          python scripts/sync_bundled.py --check || python scripts/sync_bundled.py

      - name: Run unit test suite
        timeout-minutes: 10
        run: |
          python tests/run_all_tests.py

      - name: Verify CLI commands
        run: |
          agents-memory --version
          agents-memory version
          agents-memory --help
          agents-memory help
          agents-memory remote --help
          agents-memory inventory --json

      - name: Verify Docker build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          docker build -t agents-memory:test .

      - name: Build package distribution
        run: |
          python -m build

      - name: Validate distribution metadata
        run: |
          twine check dist/*
